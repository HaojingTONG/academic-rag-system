# GitHub Actions - Continuous Integration
# ========================================
# 自动运行测试、代码检查和构建

name: Tests and CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ========================================
  # 代码质量检查
  # ========================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install black flake8 isort mypy
        pip install -r requirements.txt

    - name: Run Black (code formatting)
      run: black --check rag/ app/ indexer/ tests/

    - name: Run Flake8 (linting)
      run: flake8 rag/ app/ indexer/ --max-line-length=120 --extend-ignore=E203,W503

    - name: Run isort (import sorting)
      run: isort --check-only rag/ app/ indexer/ tests/

  # ========================================
  # 单元测试
  # ========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests with coverage
      run: |
        pytest tests/ -v \
          --cov=rag \
          --cov=app \
          --cov=indexer \
          --cov-report=xml \
          --cov-report=html \
          --junitxml=junit.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # ========================================
  # Docker构建测试
  # ========================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: academic-rag:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run -d --name rag-test -p 8000:8000 \
          -e OPENAI_API_KEY=test \
          academic-rag:test
        sleep 10
        curl -f http://localhost:8000/health || exit 1
        docker stop rag-test

  # ========================================
  # 前端测试（如果有）
  # ========================================
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run linting
      working-directory: ./frontend
      run: npm run lint || true

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

  # ========================================
  # 通知
  # ========================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint, test, docker, frontend]
    if: always()

    steps:
    - name: Send notification
      run: |
        echo "CI Pipeline completed"
        echo "Status: ${{ job.status }}"
