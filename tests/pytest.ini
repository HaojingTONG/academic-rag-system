[pytest]
# Pytest Configuration for Academic RAG System
# =============================================

# Minimum pytest version
minversion = 7.0

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    # Verbosity
    -v
    --tb=short

    # Coverage
    --cov=rag
    --cov=indexer
    --cov=models
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml

    # Strict
    --strict-markers
    --strict-config

    # Warnings
    -W error::DeprecationWarning
    -W ignore::DeprecationWarning:chromadb

    # Performance
    --durations=10

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    regression: marks tests as regression tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    requires_ollama: marks tests that require Ollama to be running
    requires_gpu: marks tests that require GPU

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
[coverage:run]
source = rag,indexer,models,app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv*/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
sort = Cover

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
