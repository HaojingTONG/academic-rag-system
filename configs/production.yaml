# Production Environment Configuration
# 生产环境配置
# =====================================
# 继承自default.yaml，覆盖生产环境特定配置

# 系统配置
system:
  log_level: "WARNING"  # 生产环境只记录警告和错误
  log_format: "json"    # 生产环境使用JSON格式便于日志收集

# API配置
api:
  host: "0.0.0.0"      # 生产环境监听所有接口
  port: 8000
  reload: false        # 生产环境禁用热重载
  workers: 8           # 生产环境多worker

# 性能配置
performance:
  enable_caching: true
  enable_embedding_cache: true
  max_concurrent_requests: 50  # 生产环境支持更多并发

# 安全配置
security:
  cors_origins: ["https://your-frontend-domain.com"]
  rate_limiting: true
  max_requests_per_minute: 100

# 调试选项（生产环境禁用）
debug:
  enable_profiling: false
  verbose_errors: false
  log_queries: false
  log_retrieval_details: false

# 监控配置
monitoring:
  enable_metrics: true
  metrics_port: 9090
  health_check_interval: 30
